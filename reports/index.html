<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; }
  .card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    border-left: 4px solid;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .card-link { text-decoration: none; color: inherit; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 500;
    background: #e0e7ff;
    color: #4338ca;
  }
</style>
</head>
<body class="p-8 max-w-4xl mx-auto">

<div class="mb-8">
  <p class="text-xs font-semibold text-indigo-500 uppercase tracking-widest mb-1">Analytics</p>
  <h1 class="text-3xl font-bold text-gray-900">Reports Dashboard</h1>
  <p class="text-gray-500 mt-1">Auto-refreshed daily at 6:00 AM</p>
</div>

<div class="grid gap-4">

  <!-- Claude Usage -->
  <a class="card-link" href="/reports/claude-usage/">
    <div class="card p-5" style="border-left-color: #6366f1">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-semibold text-gray-900">Claude Code Usage</h3>
        <span class="text-gray-400">→</span>
      </div>
      <p class="text-sm text-gray-600 mb-3">
        Token usage, skill invocations, and session analytics from Claude Code transcripts.
      </p>
      <div class="flex gap-2">
        <span class="tag">Personal</span>
        <span class="tag">Daily refresh</span>
      </div>
    </div>
  </a>

  <!-- Placeholder for future reports -->

        <h3 class="font-semibold text-gray-900">Action Adoption</h3>
        <span class="text-gray-400">→</span>
      </div>
      <p class="text-sm text-gray-600 mb-3">
        Fleet-wide action adoption metrics, funnel conversion, and monthly trends.
      </p>
      <div class="flex gap-2">
        <span class="tag">Fleet-wide</span>
        <span class="tag">Daily refresh</span>
      </div>
    </div>
  </a>
  -->

</div>

<div class="mt-8 text-center text-sm text-gray-400">
  <p>Generated by daily-reports.sh</p>
</div>

</body>
</html>
